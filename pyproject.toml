[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketplace-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.135,<1", "uvicorn>=0.42,<1", "openai-agents>=0.18.3,<0.19",
  "openai>=2.46,<3", "psycopg[binary]>=3.3,<4", "pgvector>=0.4,<0.5",
  "sqlglot>=29,<30", "pydantic-settings>=2.13,<3", "python-dotenv>=1.2,<2", "anyio>=4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "httpx>=0.28,<1"]
gateway = ["openai-codex==0.163.0"]
voice = [
  "gigaam @ git+https://github.com/salute-developers/GigaAM.git@7447938d791c4f3e643386ee22c33777004293a5",
  "torch==2.8.0", "torchaudio==2.8.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["catalog/*.json", "*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
