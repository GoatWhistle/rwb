<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Datum: анимация знака</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    gap: 32px;
    align-content: center;
    padding: 24px;
    box-sizing: border-box;
    background: #F4F6FB;
    font: 500 15px/1.4 Inter, system-ui, sans-serif;
    color: #1D1D1B;
  }
  .stage {
    width: min(720px, 100%);
    aspect-ratio: 239.2 / 92;
    background: #fff;
    border-radius: 32px;
    display: grid;
    place-items: center;
    box-shadow: 0 1px 2px rgb(0 0 0 / .06), 0 12px 32px rgb(35 72 255 / .08);
  }
  .stage img { width: 78%; height: auto; }
  button {
    font: inherit;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, #226CF5, #2348FF);
    border: 0;
    height: 48px;
    padding: 0 28px;
    border-radius: 16px;
    cursor: pointer;
  }
  button:active { transform: scale(.97); }
  p { margin: 0; color: #6B6B70; text-align: center; }
</style>
</head>
<body>
<div class="stage"><img id="logo" src="logo-animated.svg" alt="Datum"></div>
<button id="replay" type="button">Повторить</button>
<p>Плиты raw, core, mart, затем кубик и надпись. 1,55 с. При prefers-reduced-motion показывается финальный кадр.</p>
<script>
  const logo = document.getElementById("logo");
  document.getElementById("replay").addEventListener("click", () => {
    logo.src = "logo-animated.svg?" + Date.now();
  });
</script>
</body>
</html>
